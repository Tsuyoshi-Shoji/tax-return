app.datasource.url=jdbc:h2:file:./local-db/tax-return;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
app.datasource.username=sa
app.datasource.password=
app.datasource.driver-class-name=org.h2.Driver

app.jpa.hibernate.ddl-auto=update
app.jpa.dialect=org.hibernate.dialect.H2Dialect

# Flyway Database Migration Configuration
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=true

