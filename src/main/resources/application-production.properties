# Tax Return Application - Production Configuration
# EC2 + MySQL 環境用設定ファイル

# ============================================================
# Server Configuration
# ============================================================
server.port=8080
server.servlet.context-path=/final-tax-return-1.0-SNAPSHOT
server.servlet.session.timeout=30m
server.compression.enabled=true
server.compression.min-response-size=1024

# ============================================================
# Database Configuration
# 環境変数またはシステムプロパティから取得
# ============================================================
spring.datasource.url=jdbc:mysql://localhost:3306/${DB_NAME:taxtax}?useSSL=true&serverTimezone=UTC&allowPublicKeyRetrieval=true&cachePreparedStatements=true&preparedStatementCacheSize=250&preparedStatementCacheSqlLimit=2048
spring.datasource.username=${DB_USER:taxapp}
spring.datasource.password=${DB_PASS:changeme}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Connection Pool Configuration
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.auto-commit=true

# ============================================================
# JPA/Hibernate Configuration
# ============================================================
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# ============================================================
# Logging Configuration
# ============================================================
logging.level.root=WARN
logging.level.org.example=INFO
logging.level.org.springframework.web=WARN
logging.level.org.hibernate=WARN
logging.file.name=/opt/tomcat/logs/application.log
logging.file.max-size=10MB
logging.file.max-history=7
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n

# ============================================================
# Security Configuration
# ============================================================
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never
server.error.include-exception=false

# HTTPS/SSL Configuration (if needed)
# server.ssl.enabled=true
# server.ssl.key-store=/opt/certs/keystore.jks
# server.ssl.key-store-password=${SSL_KEYSTORE_PASS}
# server.ssl.key-store-type=JKS

# ============================================================
# Application Specific Configuration
# ============================================================
# Tomcat Configuration
server.tomcat.threads.max=200
server.tomcat.threads.min-spare=10
server.tomcat.accept-count=100
server.tomcat.max-connections=10000

# ============================================================
# Environment Profile
# ============================================================
spring.profiles.active=production
app.environment=production
app.version=1.0-SNAPSHOT
