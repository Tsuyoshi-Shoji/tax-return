# Tax Return Application - Production Configuration
# EC2 + MySQL 環境用設定ファイル

app.datasource.url=jdbc:mysql://localhost:3306/${DB_NAME:taxtax}?useSSL=true&serverTimezone=UTC&allowPublicKeyRetrieval=true&cachePreparedStatements=true&preparedStatementCacheSize=250&preparedStatementCacheSqlLimit=2048
app.datasource.username=${DB_USER:taxapp}
app.datasource.password=${DB_PASS:changeme}
app.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

app.jpa.hibernate.ddl-auto=validate
app.jpa.dialect=org.hibernate.dialect.MySQL8Dialect

server.port=8080
server.servlet.context-path=/final-tax-return-1.0-SNAPSHOT
server.servlet.session.timeout=30m
server.compression.enabled=true
server.compression.min-response-size=1024
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never
server.error.include-exception=false

logging.level.root=WARN
logging.level.org.example=INFO
logging.level.org.springframework.web=WARN
logging.level.org.hibernate=WARN
logging.file.name=/opt/tomcat/logs/application.log
logging.file.max-size=10MB
logging.file.max-history=7
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n

server.tomcat.threads.max=200
server.tomcat.threads.min-spare=10
server.tomcat.accept-count=100
server.tomcat.max-connections=10000

app.environment=production
app.version=1.0-SNAPSHOT
