server {
    listen 10.77.0.1:443 ssl;
    server_name 10.77.0.1;

    ssl_certificate /etc/nginx/tax-return/server.crt;
    ssl_certificate_key /etc/nginx/tax-return/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_tickets off;

    allow 10.77.0.2;
    allow 10.77.0.3;
    allow 10.77.0.4;
    deny all;

    access_log off;
    client_max_body_size 1m;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location /final-tax-return-1.0-SNAPSHOT/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host 10.77.0.1;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    location / {
        return 404;
    }
}
