name: Deploy to EC2

on:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ${{ fromJSON(vars.EC2_DEPLOY_RUNNER || '"ubuntu-latest"') }}
    env:
      APP_NAME: final-tax-return-1.0-SNAPSHOT
      APP_CONTEXT_PATH: /final-tax-return-1.0-SNAPSHOT
      APP_PORT: 8080

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build WAR
        run: mvn clean package -DskipTests -q

      - name: Verify WAR artifact
        run: |
          WAR_FILE="target/${APP_NAME}.war"
          if [ ! -f "$WAR_FILE" ]; then
            echo "❌ WAR file not found: $WAR_FILE"
            exit 1
          fi
          echo "✓ WAR file created: $(ls -lh $WAR_FILE | awk '{print $9, $5}')"

      - name: Resolve deployment target
        id: target
        shell: bash
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          HOST="$EC2_HOST"
          HOST="${HOST#[}"
          HOST="${HOST%]}"
          if [[ ! "$HOST" =~ ^[a-zA-Z0-9.:-]+$ ]] || [[ "$HOST" == -* ]]; then
            echo "EC2_HOST must be an IP address or hostname, without a port or URL"
            exit 1
          fi

          echo "host=$HOST" >> "$GITHUB_OUTPUT"
          echo "base_url=https://10.77.0.1${APP_CONTEXT_PATH}" >> "$GITHUB_OUTPUT"

      - name: Deploy and verify via SSH
        shell: bash
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_PRIVATE_KEY: ${{ secrets.EC2_PRIVATE_KEY }}
          EC2_KNOWN_HOSTS: ${{ secrets.EC2_KNOWN_HOSTS }}
        run: |
          set -euo pipefail

          if [ -z "${EC2_HOST:-}" ]; then
            echo "EC2_HOST secret is not set"
            exit 1
          fi

          SSH_HOST="${EC2_HOST#[}"
          SSH_HOST="${SSH_HOST%]}"
          if [ -z "${EC2_PRIVATE_KEY:-}" ] || [ -z "${EC2_KNOWN_HOSTS:-}" ]; then
            echo "EC2_PRIVATE_KEY and EC2_KNOWN_HOSTS secrets must be set"
            exit 1
          fi

          ADDRESS_FAMILY="any"
          if [[ "$SSH_HOST" == *:* ]]; then
            ADDRESS_FAMILY="inet6"
            if ! ip -6 route get "$SSH_HOST" > /dev/null 2>&1; then
              echo "No IPv6 route to EC2. Configure EC2_DEPLOY_RUNNER for an IPv6-capable runner, or use a reachable IPv4 EC2_HOST."
              exit 1
            fi
          fi

          umask 077
          SSH_DIR=$(mktemp -d "${RUNNER_TEMP}/ec2-ssh.XXXXXX")
          trap 'rm -rf "$SSH_DIR"' EXIT
          KEY_FILE="$SSH_DIR/key"
          KNOWN_HOSTS="$SSH_DIR/known_hosts"
          printf '%s\n' "$EC2_PRIVATE_KEY" > "$KEY_FILE"
          printf '%s\n' "$EC2_KNOWN_HOSTS" > "$KNOWN_HOSTS"

          cat > "$SSH_DIR/config" <<EOF
          Host ec2-deploy
            HostName $SSH_HOST
            User ec2-user
            IdentityFile "$KEY_FILE"
            IdentitiesOnly yes
            UserKnownHostsFile "$KNOWN_HOSTS"
            StrictHostKeyChecking yes
            BatchMode yes
            ConnectTimeout 15
            AddressFamily $ADDRESS_FAMILY
          EOF

          ssh -F "$SSH_DIR/config" ec2-deploy 'sudo -n /opt/deploy.sh'

          ssh -F "$SSH_DIR/config" ec2-deploy bash -s -- "$APP_PORT" "$APP_CONTEXT_PATH" <<'REMOTE'
          set -euo pipefail
          HEALTH_URL="http://127.0.0.1:${1}${2}/login"
          echo "Waiting for application startup..."
          sleep 15
          for i in {1..10}; do
            HTTP_CODE=$(curl --noproxy '*' --connect-timeout 5 --max-time 10 -s -o /dev/null -w "%{http_code}" "$HEALTH_URL") || HTTP_CODE="000"

            if [ "$HTTP_CODE" = "200" ]; then
              echo "✓ Application is healthy (HTTP $HTTP_CODE)"
              exit 0
            fi

            echo "Attempt $i: HTTP $HTTP_CODE - retrying..."
            sleep 3
          done

          echo "❌ Application verification failed"
          exit 1
          REMOTE

      - name: Deployment Summary
        if: always()
        shell: bash
        env:
          BASE_URL: ${{ steps.target.outputs.base_url }}
          DEPLOY_HOST: ${{ steps.target.outputs.host }}
        run: |
          if [ "${{ job.status }}" == "success" ]; then
            echo "✅ Deployment completed successfully"
            if [ -n "${BASE_URL:-}" ]; then
              echo "Application URL: ${BASE_URL}/"
            else
              echo "Application URL: unavailable"
            fi
          else
            echo "❌ Deployment failed - check EC2 instance"
            if [ -n "${DEPLOY_HOST:-}" ]; then
              echo "Debug: ssh -i <key> ec2-user@${DEPLOY_HOST}"
            else
              echo "Debug: ssh -i <key> ec2-user@<EC2_HOST>"
            fi
            echo "Logs: tail -f /var/log/deploy.log"
            exit 1
          fi
