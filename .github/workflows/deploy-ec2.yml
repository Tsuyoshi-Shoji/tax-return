name: Deploy to EC2

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      APP_NAME: final-tax-return-1.0-SNAPSHOT
      APP_CONTEXT_PATH: /final-tax-return-1.0-SNAPSHOT
      APP_PORT: 8080

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build WAR
        run: mvn clean package -DskipTests -q

      - name: Verify WAR artifact
        run: |
          WAR_FILE="target/${APP_NAME}.war"
          if [ ! -f "$WAR_FILE" ]; then
            echo "❌ WAR file not found: $WAR_FILE"
            exit 1
          fi
          echo "✓ WAR file created: $(ls -lh $WAR_FILE | awk '{print $9, $5}')"

      - name: Resolve deployment target
        id: target
        shell: bash
        run: |
          HOST='${{ secrets.EC2_HOST }}'
          HOST="${HOST#[}"
          HOST="${HOST%]}"

          if [[ "$HOST" == *:* ]]; then
            CURL_HOST="[$HOST]"
          else
            CURL_HOST="$HOST"
          fi

          echo "host=$HOST" >> "$GITHUB_OUTPUT"
          echo "base_url=http://$CURL_HOST:${APP_PORT}${APP_CONTEXT_PATH}" >> "$GITHUB_OUTPUT"
          echo "health_url=http://$CURL_HOST:${APP_PORT}/" >> "$GITHUB_OUTPUT"

      - name: Deploy via SSH
        shell: bash
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_PRIVATE_KEY: ${{ secrets.EC2_PRIVATE_KEY }}
        run: |
          set -euo pipefail

          if [ -z "${EC2_HOST:-}" ]; then
            echo "EC2_HOST secret is not set"
            exit 1
          fi

          SSH_HOST="${EC2_HOST#[}"
          SSH_HOST="${SSH_HOST%]}"

          mkdir -p ~/.ssh
          KEY_FILE="$HOME/.ssh/ec2_deploy_key"
          KNOWN_HOSTS="$HOME/.ssh/known_hosts"

          printf '%s\n' "$EC2_PRIVATE_KEY" > "$KEY_FILE"
          chmod 600 "$KEY_FILE"
          : > "$KNOWN_HOSTS"

          ADDRESS_FAMILY="any"
          if [[ "$SSH_HOST" == *:* ]]; then
            ADDRESS_FAMILY="inet6"
            ssh-keyscan -6 -H "$SSH_HOST" >> "$KNOWN_HOSTS" 2>/dev/null
          else
            ssh-keyscan -H "$SSH_HOST" >> "$KNOWN_HOSTS" 2>/dev/null
          fi

          cat > "$HOME/.ssh/config" <<EOF
          Host ec2-deploy
            HostName $SSH_HOST
            User ec2-user
            IdentityFile $KEY_FILE
            IdentitiesOnly yes
            UserKnownHostsFile $KNOWN_HOSTS
            StrictHostKeyChecking yes
            AddressFamily $ADDRESS_FAMILY
          EOF
          chmod 600 "$HOME/.ssh/config"

          ssh ec2-deploy 'bash -lc "set -euo pipefail; source /opt/db-credentials.env; sudo /opt/deploy.sh"'

      - name: Verify Deployment
        run: |
          echo "Waiting for application startup..."
          sleep 15
          for i in {1..10}; do
            HTTP_CODE=$(curl -g -s -o /dev/null -w "%{http_code}" "${{ steps.target.outputs.health_url }}" || echo "000")

            if [ "$HTTP_CODE" = "200" ]; then
              echo "✓ Application is healthy (HTTP $HTTP_CODE)"
              exit 0
            fi

            echo "Attempt $i: HTTP $HTTP_CODE - retrying..."
            sleep 3
          done

          echo "❌ Application verification failed"
          exit 1

      - name: Deployment Summary
        if: always()
        shell: bash
        env:
          BASE_URL: ${{ steps.target.outputs.base_url }}
          DEPLOY_HOST: ${{ steps.target.outputs.host }}
        run: |
          if [ "${{ job.status }}" == "success" ]; then
            echo "✅ Deployment completed successfully"
            if [ -n "${BASE_URL:-}" ]; then
              echo "Application URL: ${BASE_URL}/"
            else
              echo "Application URL: unavailable"
            fi
          else
            echo "❌ Deployment failed - check EC2 instance"
            if [ -n "${DEPLOY_HOST:-}" ]; then
              echo "Debug: ssh -i <key> ec2-user@${DEPLOY_HOST}"
            else
              echo "Debug: ssh -i <key> ec2-user@<EC2_HOST>"
            fi
            echo "Logs: tail -f /var/log/deploy.log"
            exit 1
          fi
