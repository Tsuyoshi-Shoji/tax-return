name: Deploy to EC2

on:
  push:
    branches: [ main ]
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ec2-production-deploy-and-cleanup
  cancel-in-progress: false

jobs:
  build-and-deploy:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      EC2_SECURITY_GROUP_ID: ${{ vars.EC2_SECURITY_GROUP_ID }}
      APP_CONTEXT_PATH: /final-tax-return-1.0-SNAPSHOT
      APP_PORT: '8080'

    steps:
      - uses: actions/checkout@v4

      - name: Validate deployment settings
        env:
          AWS_DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_PRIVATE_KEY: ${{ secrets.EC2_PRIVATE_KEY }}
          EC2_KNOWN_HOSTS: ${{ secrets.EC2_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import ipaddress
          import os
          import sys
          names = ("AWS_REGION", "AWS_DEPLOY_ROLE_ARN", "EC2_SECURITY_GROUP_ID",
                   "EC2_HOST", "EC2_PRIVATE_KEY", "EC2_KNOWN_HOSTS")
          missing = [name for name in names if not os.environ.get(name)]
          if missing:
              sys.exit("Missing repository Actions settings: " + ", ".join(missing))
          ipaddress.IPv4Address(os.environ["EC2_HOST"])
          PY

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Build WAR
        run: mvn --batch-mode clean package -DskipTests

      - name: Configure short-lived AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: deploy-${{ github.run_id }}-${{ github.run_attempt }}
          role-duration-seconds: 3600

      - name: Temporarily allow runner SSH
        run: |
          set -euo pipefail
          python3 scripts/ci/ssh_ingress.py expired
          RUNNER_IP=$(curl --ipv4 --noproxy '*' --fail --silent --show-error --connect-timeout 5 --max-time 15 https://checkip.amazonaws.com)
          python3 scripts/ci/ssh_ingress.py open --ip "$RUNNER_IP"

      - name: Deploy and verify via SSH
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_PRIVATE_KEY: ${{ secrets.EC2_PRIVATE_KEY }}
          EC2_KNOWN_HOSTS: ${{ secrets.EC2_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          umask 077
          SSH_DIR=$(mktemp -d "$RUNNER_TEMP/ec2-ssh.XXXXXX")
          trap 'rm -f "$SSH_DIR/key" "$SSH_DIR/known_hosts" "$SSH_DIR/config"; rmdir "$SSH_DIR"' EXIT
          printf '%s\n' "$EC2_PRIVATE_KEY" > "$SSH_DIR/key"
          printf '%s\n' "$EC2_KNOWN_HOSTS" > "$SSH_DIR/known_hosts"
          cat > "$SSH_DIR/config" <<EOF
          Host ec2-deploy
            HostName $EC2_HOST
            User ec2-user
            IdentityFile "$SSH_DIR/key"
            IdentitiesOnly yes
            UserKnownHostsFile "$SSH_DIR/known_hosts"
            StrictHostKeyChecking yes
            BatchMode yes
            ConnectTimeout 15
            ConnectionAttempts 3
            AddressFamily inet
          EOF
          ssh -F "$SSH_DIR/config" ec2-deploy 'sudo -n /opt/deploy.sh'
          ssh -F "$SSH_DIR/config" ec2-deploy bash -s -- "$APP_PORT" "$APP_CONTEXT_PATH" <<'REMOTE'
          set -euo pipefail
          for i in {1..10}; do
            HTTP_CODE=$(curl --noproxy '*' --connect-timeout 5 --max-time 10 -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:${1}${2}/login") || HTTP_CODE=000
            if [ "$HTTP_CODE" = 200 ]; then
              echo "Application health check passed (HTTP 200)"
              exit 0
            fi
            echo "Health check $i/10: HTTP $HTTP_CODE"
            sleep 3
          done
          echo "Application health check failed" >&2
          exit 1
          REMOTE

      - name: Revoke this run's SSH permission
        if: ${{ always() }}
        run: |
          set -euo pipefail
          if [ -n "${AWS_ACCESS_KEY_ID:-}" ]; then
            python3 scripts/ci/ssh_ingress.py close
          else
            echo "AWS credentials were not acquired; this run could not add an SSH rule."
          fi

  cleanup-expired-ssh:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      EC2_SECURITY_GROUP_ID: ${{ vars.EC2_SECURITY_GROUP_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: cleanup-${{ github.run_id }}
      - name: Revoke expired managed SSH rules
        run: python3 scripts/ci/ssh_ingress.py expired
