name: Deploy to EC2

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      
      - name: Build WAR
        run: mvn clean package -DskipTests -q
      
      - name: Verify WAR artifact
        run: |
          WAR_FILE="target/final-tax-return-1.0-SNAPSHOT.war"
          if [ ! -f "$WAR_FILE" ]; then
            echo "❌ WAR file not found: $WAR_FILE"
            exit 1
          fi
          echo "✓ WAR file created: $(ls -lh $WAR_FILE | awk '{print $9, $5}')"
      
      - name: Deploy via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_PRIVATE_KEY }}
          port: 22
          timeout: 120s
          command_timeout: 180s
          script: |
            set -e
            source /opt/db-credentials.env
            /opt/deploy.sh
      
      - name: Verify Deployment
        run: |
          echo "Waiting for application startup..."
          sleep 15
          
          for i in {1..10}; do
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
              "http://${{ secrets.EC2_HOST }}:8080/final-tax-return-1.0-SNAPSHOT/home" || echo "000")
            
            if [ "$HTTP_CODE" = "200" ]; then
              echo "✓ Application is healthy (HTTP $HTTP_CODE)"
              exit 0
            fi
            
            echo "Attempt $i: HTTP $HTTP_CODE - retrying..."
            sleep 3
          done
          
          echo "❌ Application verification failed"
          exit 1
      
      - name: Deployment Summary
        if: always()
        run: |
          if [ "${{ job.status }}" == "success" ]; then
            echo "✅ Deployment completed successfully"
            echo "Application URL: http://${{ secrets.EC2_HOST }}:8080/final-tax-return-1.0-SNAPSHOT/"
          else
            echo "❌ Deployment failed - check EC2 instance"
            echo "Debug: ssh -i <key> ec2-user@${{ secrets.EC2_HOST }}"
            echo "Logs: tail -f /var/log/deploy.log"
            exit 1
          fi
